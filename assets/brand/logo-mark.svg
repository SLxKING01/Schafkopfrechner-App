<!-- App logo mark "Kartenfächer": three Schafkopf cards, Gras and Herz behind, Eichel in front. The viewBox is the logo's round disc (the same 78 px circle the app draws). A mask hides the back cards behind the front card, so the mark works on any background and in one colour. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 150 724 724" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <mask id="front-card-cutout" maskUnits="userSpaceOnUse" x="150" y="150" width="724" height="724">
      <rect x="150" y="150" width="724" height="724" fill="#fff"/>
      <rect x="383" y="321" width="258" height="368" rx="38" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#front-card-cutout)">
    <g transform="rotate(-18 512 760)" stroke-width="16">
      <rect x="392" y="330" width="240" height="350" rx="30" stroke-opacity="0.7"/>
      <g transform="translate(434 384) scale(0.45)" stroke-width="22.2" stroke-opacity="0.85">
        <path d="M-40 46 C-52 -10 -10 -52 48 -50 C52 8 10 52 -40 46 Z"/>
        <path d="M-40 46 L14 -8"/>
      </g>
    </g>
    <g transform="rotate(18 512 760)" stroke-width="16">
      <rect x="392" y="330" width="240" height="350" rx="30" stroke-opacity="0.7"/>
      <g transform="translate(590 384) scale(0.42)" stroke-width="23.8" stroke-opacity="0.85">
        <path d="M0 50 C-30 26 -50 6 -50 -14 C-50 -34 -34 -46 -18 -46 C-8 -46 -2 -40 0 -32 C2 -40 8 -46 18 -46 C34 -46 50 -34 50 -14 C50 6 30 26 0 50 Z"/>
      </g>
    </g>
  </g>
  <rect x="392" y="330" width="240" height="350" rx="30" stroke-width="18"/>
  <g transform="translate(512 505) scale(1.75)" stroke-width="10.3">
    <path d="M0 -40 C0 -52 5 -58 14 -62"/>
    <path d="M-38 -6 C-38 -30 -22 -40 0 -40 C22 -40 38 -30 38 -6 Z"/>
    <path d="M-30 -2 C-32 26 -18 48 0 58 C18 48 32 26 30 -2"/>
  </g>
</svg>
